[project]
name = "media"
version = "1.0.0"
description = "Download Instagram Reels and YouTube Shorts as Finder-friendly H.264 MP4s."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.8.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
media = "media.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
